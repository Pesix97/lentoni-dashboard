# Aggiornamento automatico della dashboard Lentoni, interamente sui server GitHub.
#
# Perche' proclubstracker e non le API dirette di EA: EA risponde 403 alle richieste che
# arrivano da un data center, verificato il 20/08/2026 da questo stesso runner.
#
# Perche' un ciclo invece di un solo controllo: la pianificazione di GitHub non e'
# affidabile. Misurato il 21/08/2026, con cadenza oraria impostata, in tre ore e mezza e'
# partita una sola esecuzione, e con venti minuti di ritardo. Invece di sperare in trigger
# puntuali, ogni esecuzione resta viva ~2 ore e controlla ogni 20 minuti: basta un trigger
# riuscito per coprire una finestra ampia. Sui repository pubblici i minuti sono gratuiti.
name: Aggiorna dashboard Lentoni

on:
  schedule:
    # MINUTI DISPARI, DI PROPOSITO. Non e' un dettaglio estetico: la documentazione di
    # GitHub dice che i lavori programmati vengono ritardati quando la piattaforma e'
    # sotto carico, che "l'inizio di ogni ora" e' proprio uno di quei momenti, e che se il
    # carico e' abbastanza alto "alcuni lavori in coda possono essere SCARTATI". Il
    # consiglio esplicito e' di programmare a un minuto diverso dell'ora.
    #
    # Fino al 28/08/2026 i due orari erano :00 e :30, cioe' i due minuti piu' affollati
    # del mondo. Misurato quel giorno sulla lista delle Actions: 7 partenze programmate il
    # 26 agosto, ZERO il 27, UNA il 28 - su 48 previste al giorno. Nessuna cancellata:
    # proprio mai create, che e' la firma dello scarto per carico.
    #
    # Quattro occasioni invece di due perche' ora non costano niente: le partenze
    # programmate si accodano (vedi il blocco `concurrency`), quindi quelle in piu' non
    # uccidono il ciclo in corso, aspettano il loro turno. Ne basta UNA riuscita ogni
    # cinque ore per non avere buchi.
    - cron: '7 * * * *'
    - cron: '22 * * * *'
    - cron: '37 * * * *'
    - cron: '52 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aggiorna-dashboard.yml'
      - 'giro.sh'
      - 'roles.json'
      - 'generate_dashboard.py'
      - 'ingest.py'
      - 'avversari.py'
      - 'club.json'
      - 'raw/club_search.json'

# Due gruppi distinti, ed e' una correzione nata da una misura: dei 28 push fatti il
# 23/08/2026, dodici sono stati seguiti da oltre venticinque minuti senza un giro
# automatico. Con un gruppo solo e cancel-in-progress, ogni push che tocca il codice
# uccideva il ciclo che stava coprendo la notte, e la finestra rimanente andava persa.
#
# Ora il ciclo lungo (pianificato) e la verifica breve (dopo un push) vivono in gruppi
# separati e non si cancellano a vicenda.
#
# DENTRO il gruppo del ciclo, invece, cancellare e' esattamente l'errore da non fare, ed e'
# costato una serata intera. Fra il 27 e il 28/08/2026 l'automazione e' rimasta ferma
# sedici ore con la lista delle Actions piena di esecuzioni, tutte cancellate.
#
# Il meccanismo: la mattina del 27/08 il ciclo e' passato da 2h20 a 5h20 e i cron da uno a
# due l'ora. Con cancel-in-progress ogni esecuzione programmata veniva quindi uccisa dalla
# successiva entro trenta minuti - e poiche' la pianificazione di GitHub arriva anche con
# un'ora di ritardo, la vittima era spesso ancora IN CODA, cioe' moriva senza eseguire un
# solo passo. Nessun giro, e nemmeno un avvio nel battito: un'esecuzione cancellata prima
# di partire non arriva mai al checkout. Le due modifiche erano nate per ridurre i buchi e
# ne hanno prodotto uno da sedici ore.
#
# La regola generale: se il ciclo dura piu' dell'intervallo fra due cron, cancellare
# significa non finire mai. Ora le esecuzioni programmate si ACCODANO. GitHub ne tiene al
# massimo una in esecuzione e una in attesa, quindi non si accumulano, e quando il ciclo
# lungo finisce la successiva parte subito: la copertura non ha stacchi.
#
# Per le verifiche da push resta invece giusto cancellare: durano un minuto, contano solo
# le ultime, e accodarle allungherebbe solo la fila. Due esecuzioni contemporanee che
# scrivono sullo stesso database non sono un problema: giro.sh gestisce gia' il push
# respinto rifacendo un rebase.
concurrency:
  group: aggiorna-dashboard-${{ github.event_name == 'schedule' && 'ciclo' || 'verifica' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    # Cinque ore e mezza, sotto il limite di sei di GitHub. Serve a coprire con UN SOLO
    # trigger riuscito l'intera fascia in cui il club gioca: misurato il 27/08/2026, una
    # partita ogni 19 minuti e sessioni fra le 22 e le 3. EA espone solo le ultime dieci
    # partite, quindi un buco di tre ore in quella fascia costa partite per sempre - e non
    # esiste modo di recuperarle: proclubstracker restituisce le stesse dieci, non un
    # archivio. L'unica protezione e' non lasciare mai il buco arrivare a tre ore.
    # Misurato il 27/08/2026: un giro dura 6-12 secondi, gli intervalli fra giri
    # consecutivi sono 20,1 minuti contro una pausa di 20. Sedici giri costano quindi ~305
    # minuti; 350 lascia margine per i giri lenti restando sotto il limite di 360 di
    # GitHub. Se il tempo scadesse comunque, i giri gia' fatti hanno gia' pubblicato.
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Il segno "sono partito", scritto PRIMA del ciclo e apposta in un passo separato.
      # Senza, un'esecuzione che muore prima del primo giro non lascia traccia da nessuna
      # parte ed e' identica a un'esecuzione che GitHub non ha mai lanciato: due guasti
      # opposti che si cercherebbero nel posto sbagliato. L'alternativa era leggere i log
      # delle Actions, che richiede un accesso esterno al repository - il connettore GitHub
      # sincronizza i file di un ramo, non le esecuzioni.
      # Non blocca: se il segno non si scrive, il ciclo deve partire lo stesso.
      - name: Segna l'avvio
        continue-on-error: true
        run: |
          git config user.name "Lentoni Dashboard Bot"
          git config user.email "peppeblu84@gmail.com"
          chmod +x giro.sh
          ./giro.sh --solo-avvio

      - name: Ciclo di aggiornamento
        run: |
          git config user.name "Lentoni Dashboard Bot"
          git config user.email "peppeblu84@gmail.com"
          chmod +x giro.sh
          # Il ciclo lungo serve a coprire la notte quando la pianificazione di GitHub
          # salta dei turni. Dopo un push serve invece solo verificare che la modifica
          # produca una pagina valida: un giro solo, cosi' l'esecuzione dura un minuto
          # e non tiene occupato nulla.
          #
          # Sedici giri da venti minuti coprono 5h20. Erano sette (2h20) fino al
          # 27/08/2026: quel giorno sono mancati 27 giri su 78 attesi in ventisei ore, e
          # con la finestra corta bastava che GitHub saltasse tre trigger di fila per
          # lasciare scoperta una serata intera. Ora per scoprirne una devono saltarne
          # sedici consecutivi.
          if [ "${{ github.event_name }}" = "schedule" ]; then GIRI=16; else GIRI=1; fi
          echo "evento: ${{ github.event_name }} -> $GIRI giri"
          for i in $(seq 1 $GIRI); do
            ./giro.sh
            if [ "$i" -lt "$GIRI" ]; then sleep 1200; fi
          done
          echo "completato: $GIRI giri"
