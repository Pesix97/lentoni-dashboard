# Aggiornamento automatico della dashboard Lentoni, interamente sui server GitHub.
#
# Perche' proclubstracker e non le API dirette di EA: EA risponde 403 alle richieste che
# arrivano da un data center, verificato il 20/08/2026 da questo stesso runner.
#
# Perche' un ciclo invece di un solo controllo: la pianificazione di GitHub non e'
# affidabile. Misurato il 21/08/2026, con cadenza oraria impostata, in tre ore e mezza e'
# partita una sola esecuzione, e con venti minuti di ritardo. Invece di sperare in trigger
# puntuali, ogni esecuzione resta viva ~2 ore e controlla ogni 20 minuti: basta un trigger
# riuscito per coprire una finestra ampia. Sui repository pubblici i minuti sono gratuiti.
name: Aggiorna dashboard Lentoni

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aggiorna-dashboard.yml'
      - 'giro.sh'
      - 'roles.json'
      - 'generate_dashboard.py'
      - 'ingest.py'
      - 'avversari.py'
      - 'club.json'
      - 'raw/club_search.json'

# Un trigger nuovo sostituisce il ciclo in corso invece di accodarsi: cosi' non si
# accumulano esecuzioni sovrapposte che scriverebbero sullo stesso database.
concurrency:
  group: aggiorna-dashboard
  cancel-in-progress: true

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ciclo di aggiornamento
        run: |
          git config user.name "Lentoni Dashboard Bot"
          git config user.email "peppeblu84@gmail.com"
          chmod +x giro.sh
          for i in $(seq 1 7); do
            ./giro.sh
            if [ "$i" -lt 7 ]; then sleep 1200; fi
          done
          echo "ciclo completato: 7 controlli in circa 2 ore"
